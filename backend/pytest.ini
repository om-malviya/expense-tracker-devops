[pytest]
# Run from backend/: `pytest -v`. pythonpath makes `import app` work without installing the package.
pythonpath = .
testpaths = tests
# -p no:cacheprovider keeps .pytest_cache out of the repo; the JUnit file is what CI uploads.
addopts = -ra -p no:cacheprovider --junitxml=reports/junit.xml
filterwarnings =
    # SQLite has no DECIMAL type, so SQLAlchemy warns while converting Numeric(10,2) from float.
    # Harmless for the test-suite (production runs on PostgreSQL), so silence just that warning.
    ignore:Dialect sqlite\+pysqlite does \*not\* support Decimal objects natively:sqlalchemy.exc.SAWarning
