[alembic]
script_location = alembic
# so `from app...` works inside env.py when alembic is run from backend/
prepend_sys_path = .
# sqlalchemy.url is intentionally absent: env.py injects DATABASE_URL at runtime so the
# connection string (with its password) never lives in a committed file.

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
