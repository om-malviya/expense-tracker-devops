{{- if not .Values.postgres.existingSecret }}
# Chart-managed Secret - only rendered when postgres.existingSecret is empty.
# stringData is base64-encoded by the API server; the values here still end up in
# Helm release history, which is why production uses existingSecret instead.
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "expense-tracker.fullname" . }}-secrets
  labels:
    {{- include "expense-tracker.labels" . | nindent 4 }}
type: Opaque
stringData:
  POSTGRES_USER: {{ .Values.postgres.username | quote }}
  POSTGRES_PASSWORD: {{ .Values.postgres.password | quote }}
  DATABASE_URL: {{ include "expense-tracker.databaseUrl" . | quote }}
{{- end }}
