apiVersion: v1
kind: Service
metadata:
  name: {{ include "expense-tracker.fullname" . }}-backend
  labels:
    {{- include "expense-tracker.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
spec:
  type: {{ .Values.service.type }}
  selector:
    {{- include "expense-tracker.selectorLabels" (dict "root" . "component" "backend") | nindent 4 }}
  ports:
    - name: http            # the ServiceMonitor scrapes this named port
      port: {{ .Values.backend.port }}
      targetPort: http
