{{- if .Values.serviceMonitor.enabled }}
# Tells the Prometheus Operator to scrape every pod behind the backend Service on
# /metrics (prometheus-fastapi-instrumentator). Only rendered when enabled because
# the CRD is missing on a cluster without kube-prometheus-stack.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "expense-tracker.fullname" . }}-backend
  labels:
    {{- include "expense-tracker.labels" . | nindent 4 }}
    app.kubernetes.io/component: backend
    {{- with .Values.serviceMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  # A ServiceMonitor selects *Services*, not pods. The backend Service carries the common
  # app.kubernetes.io/* labels (not the plain `app` pod-selector label), so I match on
  # exactly those - using the pod selectorLabels here silently matched nothing and the
  # target never showed up in Prometheus.
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ include "expense-tracker.name" . }}
      app.kubernetes.io/instance: {{ .Release.Name }}
      app.kubernetes.io/component: backend
  namespaceSelector:
    matchNames: [{{ .Release.Namespace | quote }}]
  endpoints:
    - port: http
      path: /metrics
      interval: {{ .Values.serviceMonitor.interval }}
      scrapeTimeout: {{ .Values.serviceMonitor.scrapeTimeout }}
{{- end }}
