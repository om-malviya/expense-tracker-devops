{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "expense-tracker.fullname" . }}
  labels:
    {{- include "expense-tracker.labels" . | nindent 4 }}
  {{- with .Values.ingress.annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls }}
  tls:
    - secretName: {{ .Values.ingress.tlsSecretName }}
      hosts: [{{ .Values.ingress.host | quote }}]
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          # Longest prefix wins in every controller I use (Traefik, ingress-nginx, ALB),
          # so /api/... reaches the API directly and everything else gets the UI.
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: {{ include "expense-tracker.fullname" . }}-backend
                port:
                  number: {{ .Values.backend.port }}
          - path: /
            pathType: Prefix
            backend:
              service:
                name: {{ include "expense-tracker.fullname" . }}-frontend
                port:
                  number: {{ .Values.frontend.servicePort }}
{{- end }}
