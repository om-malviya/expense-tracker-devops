# Grafana auto-imports any ConfigMap carrying grafana_dashboard: "1" through its sidecar
# (grafana.sidecar.dashboards in kube-prometheus-stack-values.yaml, searchNamespace: ALL).
# The JSON is the same file as dashboards/expense-tracker.json; when I change the dashboard
# in the Grafana UI I export it and paste it back here so the ConfigMap stays the source of truth.
#   kubectl apply -f monitoring/grafana-dashboard-configmap.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: expense-tracker-grafana-dashboard
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    app.kubernetes.io/name: expense-tracker
    app.kubernetes.io/part-of: expense-tracker
data:
  expense-tracker.json: |
    {
      "__inputs": [
        {
          "name": "DS_PROMETHEUS",
          "label": "Prometheus",
          "type": "datasource",
          "pluginId": "prometheus"
        }
      ],
      "title": "Expense Tracker - API overview",
      "uid": "expense-tracker",
      "description": "Live HTTP metrics of the Expense Tracker FastAPI backend scraped from /metrics, plus pod and HPA state from kube-state-metrics.",
      "tags": ["expense-tracker", "fastapi"],
      "timezone": "browser",
      "editable": true,
      "schemaVersion": 39,
      "version": 1,
      "refresh": "15s",
      "time": {"from": "now-30m", "to": "now"},
      "templating": {
        "list": [
          {
            "name": "DS_PROMETHEUS",
            "type": "datasource",
            "query": "prometheus",
            "label": "Prometheus",
            "current": {"text": "Prometheus", "value": "Prometheus"}
          },
          {
            "name": "namespace",
            "type": "query",
            "label": "Namespace",
            "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
            "query": "label_values(http_requests_total, namespace)",
            "current": {"text": "expense-tracker", "value": "expense-tracker"},
            "refresh": 1
          }
        ]
      },
      "panels": [
        {
          "id": 1,
          "type": "stat",
          "title": "Requests / s",
          "gridPos": {"x": 0, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "decimals": 2,
              "color": {"mode": "thresholds"},
              "thresholds": {"mode": "absolute", "steps": [{"color": "green", "value": null}]}
            },
            "overrides": []
          },
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "value", "graphMode": "area"},
          "targets": [
            {"refId": "A", "expr": "sum(rate(http_requests_total{namespace=\"$namespace\"}[1m]))"}
          ]
        },
        {
          "id": 2,
          "type": "stat",
          "title": "5xx error ratio (5m)",
          "gridPos": {"x": 6, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {
            "defaults": {
              "unit": "percentunit",
              "decimals": 2,
              "color": {"mode": "thresholds"},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "orange", "value": 0.01},
                  {"color": "red", "value": 0.05}
                ]
              },
              "noValue": "0%"
            },
            "overrides": []
          },
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "value", "graphMode": "none"},
          "targets": [
            {
              "refId": "A",
              "expr": "sum(rate(http_requests_total{namespace=\"$namespace\",status=~\"5..\"}[5m])) / sum(rate(http_requests_total{namespace=\"$namespace\"}[5m]))"
            }
          ]
        },
        {
          "id": 3,
          "type": "stat",
          "title": "p95 latency (5m)",
          "gridPos": {"x": 12, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {
            "defaults": {
              "unit": "s",
              "decimals": 3,
              "color": {"mode": "thresholds"},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "green", "value": null},
                  {"color": "orange", "value": 0.25},
                  {"color": "red", "value": 0.5}
                ]
              }
            },
            "overrides": []
          },
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "value", "graphMode": "none"},
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"$namespace\"}[5m])))"
            }
          ]
        },
        {
          "id": 4,
          "type": "stat",
          "title": "Backend pods up",
          "gridPos": {"x": 18, "y": 0, "w": 6, "h": 4},
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {
            "defaults": {
              "unit": "none",
              "decimals": 0,
              "color": {"mode": "thresholds"},
              "thresholds": {
                "mode": "absolute",
                "steps": [
                  {"color": "red", "value": null},
                  {"color": "orange", "value": 1},
                  {"color": "green", "value": 2}
                ]
              }
            },
            "overrides": []
          },
          "options": {"reduceOptions": {"calcs": ["lastNotNull"]}, "colorMode": "background", "graphMode": "none"},
          "targets": [
            {"refId": "A", "expr": "sum(up{namespace=\"$namespace\", job=~\".*backend.*\"})"}
          ]
        },
        {
          "id": 5,
          "type": "timeseries",
          "title": "Requests / s by handler",
          "gridPos": {"x": 0, "y": 4, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {
            "defaults": {
              "unit": "reqps",
              "custom": {"lineWidth": 2, "fillOpacity": 10, "stacking": {"mode": "normal"}}
            },
            "overrides": []
          },
          "options": {"legend": {"displayMode": "table", "placement": "right", "calcs": ["mean", "max"]}, "tooltip": {"mode": "multi"}},
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (handler, method) (rate(http_requests_total{namespace=\"$namespace\", handler!~\"/metrics|/health|/ready\"}[1m]))",
              "legendFormat": "{{method}} {{handler}}"
            }
          ]
        },
        {
          "id": 6,
          "type": "timeseries",
          "title": "Latency p50 / p95 / p99",
          "gridPos": {"x": 12, "y": 4, "w": 12, "h": 8},
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {
            "defaults": {"unit": "s", "custom": {"lineWidth": 2, "fillOpacity": 0}},
            "overrides": []
          },
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "targets": [
            {
              "refId": "A",
              "expr": "histogram_quantile(0.50, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"$namespace\", handler=~\"/api.*\"}[5m])))",
              "legendFormat": "p50"
            },
            {
              "refId": "B",
              "expr": "histogram_quantile(0.95, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"$namespace\", handler=~\"/api.*\"}[5m])))",
              "legendFormat": "p95"
            },
            {
              "refId": "C",
              "expr": "histogram_quantile(0.99, sum by (le) (rate(http_request_duration_seconds_bucket{namespace=\"$namespace\", handler=~\"/api.*\"}[5m])))",
              "legendFormat": "p99"
            }
          ]
        },
        {
          "id": 7,
          "type": "timeseries",
          "title": "Responses by status class",
          "gridPos": {"x": 0, "y": 12, "w": 12, "h": 7},
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {
            "defaults": {"unit": "reqps", "custom": {"lineWidth": 1, "fillOpacity": 30, "stacking": {"mode": "normal"}}},
            "overrides": [
              {"matcher": {"id": "byName", "options": "2xx"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "green"}}]},
              {"matcher": {"id": "byName", "options": "4xx"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "orange"}}]},
              {"matcher": {"id": "byName", "options": "5xx"}, "properties": [{"id": "color", "value": {"mode": "fixed", "fixedColor": "red"}}]}
            ]
          },
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "targets": [
            {
              "refId": "A",
              "expr": "sum by (status) (label_replace(rate(http_requests_total{namespace=\"$namespace\", handler=~\"/api.*\"}[1m]), \"status\", \"$1xx\", \"status\", \"(.).*\"))",
              "legendFormat": "{{status}}"
            }
          ]
        },
        {
          "id": 8,
          "type": "timeseries",
          "title": "Backend HPA replicas (current vs desired vs max)",
          "gridPos": {"x": 12, "y": 12, "w": 12, "h": 7},
          "datasource": {"type": "prometheus", "uid": "${DS_PROMETHEUS}"},
          "fieldConfig": {
            "defaults": {"unit": "none", "decimals": 0, "min": 0, "custom": {"lineWidth": 2, "fillOpacity": 0, "lineInterpolation": "stepAfter"}},
            "overrides": [
              {"matcher": {"id": "byName", "options": "max"}, "properties": [{"id": "custom.lineStyle", "value": {"fill": "dash", "dash": [10, 10]}}]}
            ]
          },
          "options": {"legend": {"displayMode": "list", "placement": "bottom"}, "tooltip": {"mode": "multi"}},
          "targets": [
            {
              "refId": "A",
              "expr": "kube_horizontalpodautoscaler_status_current_replicas{namespace=\"$namespace\"}",
              "legendFormat": "current"
            },
            {
              "refId": "B",
              "expr": "kube_horizontalpodautoscaler_status_desired_replicas{namespace=\"$namespace\"}",
              "legendFormat": "desired"
            },
            {
              "refId": "C",
              "expr": "kube_horizontalpodautoscaler_spec_max_replicas{namespace=\"$namespace\"}",
              "legendFormat": "max"
            }
          ]
        }
      ]
    }
